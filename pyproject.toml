[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tayte-netsci-toolkit"
version = "0.1.0"
description = "Reusable network science functions from NETS/PHYS 7052"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Tayte Adderley" }]
dependencies = [
    "networkx",
    "numpy",
    "pandas",
]
